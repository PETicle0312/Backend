spring.application.name=peticle
spring.jpa.hibernate.ddl-auto=update
server.address=0.0.0.0

# Base64 encoded >=32 random bytes; no development/production fallback secret.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=peticle
security.jwt.access-ttl=PT15M
security.jwt.refresh-ttl=P7D
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# External school API credential; never commit the issued key.
neis.api-key=${NEIS_API_KEY:}
